name: Windows test builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "resources.qrc"
      - "README-TEST.txt"
      - "installer/**"
      - ".github/workflows/windows-test-build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            qt_arch: win64_msvc2019_64
            cmake_arch: x64
          - label: x86
            qt_arch: win32_msvc2019
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = "build/Release/AERO7 GRAM.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc /DAppArch=${{ matrix.label }} /O. installer/AERO7-GRAM.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "AERO7-GRAM-${{ matrix.label }}-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer not found: $setup" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AERO7-GRAM-${{ matrix.label }}-Setup
          path: AERO7-GRAM-${{ matrix.label }}-Setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-test-release:
    name: Publish downloadable Setup installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download x86 and x64 packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish or update latest test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: AERO7 GRAM — Latest test build
          target_commitish: main
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/*.exe
          body: |
            Автоматически собранные установщики AERO7 GRAM. Запусти Setup.exe и следуй мастеру установки.

            Это экспериментальная оболочка без TDLib. Вход в Telegram и сетевые функции недоступны.
            Совместимость с Windows 7 SP1 ещё требует отдельной проверки.
            Установщики обновляются после каждого успешного запуска Windows test builds.
