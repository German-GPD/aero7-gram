name: Windows test builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "resources.qrc"
      - "README-TEST.txt"
      - "installer/**"
      - "resources/**"
      - "tools/**"
      - "assets/telegram-aero.svg"
      - ".github/workflows/windows-test-build.yml"

permissions:
  contents: write

concurrency:
  group: aero7-gram-windows-build
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            qt_arch: win64_msvc2019_64
            cmake_arch: x64
            vcpkg_triplet: x64-windows
          - label: x86
            qt_arch: win32_msvc2019
            cmake_arch: Win32
            vcpkg_triplet: x86-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Prepare application icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render Windows icon from canonical SVG
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }

      - name: Restore TDLib dependency cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/installed
            vcpkg/packages
          key: ${{ runner.os }}-tdlib-deps-${{ matrix.vcpkg_triplet }}-openssl3-zlib1

      - name: Restore TDLib build cache
        uses: actions/cache@v4
        with:
          path: td-build
          key: ${{ runner.os }}-tdlib-build-18f6c78-${{ matrix.vcpkg_triplet }}-v1

      - name: Install TDLib build dependencies
        shell: pwsh
        run: |
          choco install gperf --no-progress -y
          if (!(Test-Path "td/CMakeLists.txt")) {
            Invoke-WebRequest -Uri "https://codeload.github.com/tdlib/td/tar.gz/18f6c78" -OutFile "tdlib-source.tar.gz"
            tar -xzf tdlib-source.tar.gz
            if (!(Test-Path "td-18f6c78/CMakeLists.txt")) { throw "TDLib source archive is invalid" }
            Move-Item "td-18f6c78" "td"
          }
          if (!(Test-Path "td/CMakeLists.txt")) { throw "TDLib source directory is missing" }
          if (!(Test-Path "vcpkg/vcpkg.exe")) {
            if (!(Test-Path "vcpkg")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
              if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
            }
            .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }
          .\vcpkg\vcpkg.exe install openssl:${{ matrix.vcpkg_triplet }} zlib:${{ matrix.vcpkg_triplet }}
          if ($LASTEXITCODE -ne 0) { throw "TDLib dependencies installation failed" }

      - name: Build official TDLib
        shell: pwsh
        run: |
          $toolchain = "$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          if (!(Test-Path "td/CMakeLists.txt")) { throw "TDLib source directory is missing before configure" }
          cmake -S td -B td-build -A ${{ matrix.cmake_arch }} -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF -DTD_ENABLE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "TDLib configure failed" }
          cmake --build td-build --config Release --target tdjson --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "TDLib build failed" }
          $lib = Get-ChildItem td-build -Filter tdjson.lib -Recurse | Select-Object -First 1
          $dll = Get-ChildItem td-build -Filter tdjson.dll -Recurse | Select-Object -First 1
          $exportHeader = Get-ChildItem td-build -Filter tdjson_export.h -Recurse | Select-Object -First 1
          if (!$lib -or !$dll -or !$exportHeader) { throw "TDLib outputs or generated export header were not found" }
          "TDJSON_LIBRARY=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TDJSON_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TDJSON_GENERATED_INCLUDE_DIR=$($exportHeader.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure application
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DAERO7_ENABLE_TDLIB=ON -DTDJSON_INCLUDE_DIR="$env:GITHUB_WORKSPACE\td" -DTDJSON_GENERATED_INCLUDE_DIR="$env:TDJSON_GENERATED_INCLUDE_DIR" -DTDJSON_LIBRARY="$env:TDJSON_LIBRARY"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = "build/Release/AERO7 GRAM.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          Copy-Item "$env:TDJSON_DLL" "build/Release/tdjson.dll"
          $runtime = "vcpkg/installed/${{ matrix.vcpkg_triplet }}/bin"
          Get-ChildItem $runtime -Filter "*.dll" | Copy-Item -Destination "build/Release" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc /DAppArch=${{ matrix.label }} /O. installer/AERO7-GRAM.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "AERO7-GRAM-${{ matrix.label }}-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer not found: $setup" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AERO7-GRAM-${{ matrix.label }}-Setup
          path: AERO7-GRAM-${{ matrix.label }}-Setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-test-release:
    name: Publish downloadable Setup installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download x86 and x64 packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish or update latest test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: AERO7 GRAM — Latest test build
          target_commitish: main
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/*.exe
          body: |
            Автоматически собранные установщики AERO7 GRAM. Запусти Setup.exe и следуй мастеру установки.

            В пакет включена TDLib, собранная из официального исходного кода. Это тестовая сборка: проверьте вход и сетевые функции самостоятельно.
            Совместимость с Windows 7 SP1 не подтверждена; сборка выполняется на Windows Server 2022.
            Установщики обновляются после каждого успешного запуска Windows test builds.
